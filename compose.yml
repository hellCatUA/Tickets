name: tickets

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://tickets:${DB_PASSWORD:?set it in .env next to compose.yml}@db:5432/tickets
      REDIS_URL: redis://redis:6379
      TZ: ${TZ:-UTC}
    # NPM runs in host network mode on this host, so it reaches the API via
    # 127.0.0.1 — same pattern as Nextcloud's 127.0.0.1:4080 binding.
    ports:
      - '127.0.0.1:4090:3000'
    # If cloud.417group.org does not resolve from inside the container,
    # uncomment and point it at the host's Tailscale IP:
    # extra_hosts:
    #   - 'cloud.417group.org:100.x.y.z'
    volumes:
      - attachments:/data/attachments
      - branding:/data/branding
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [tickets]

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://tickets:${DB_PASSWORD:?set it in .env next to compose.yml}@db:5432/tickets
      REDIS_URL: redis://redis:6379
      TZ: ${TZ:-UTC}
    volumes:
      - attachments:/data/attachments
      - branding:/data/branding
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [tickets]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set it in .env next to compose.yml}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tickets -d tickets']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [tickets]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    networks: [tickets]

volumes:
  db-data:
  redis-data:
  attachments:
  branding:

networks:
  tickets: {}
