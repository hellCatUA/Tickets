name: tickets

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql://tickets:${DB_PASSWORD}@db:5432/tickets
      REDIS_URL: redis://redis:6379
    volumes:
      - attachments:/data/attachments
      - branding:/data/branding
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [tickets, npm]

  worker:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql://tickets:${DB_PASSWORD}@db:5432/tickets
      REDIS_URL: redis://redis:6379
    volumes:
      - attachments:/data/attachments
      - branding:/data/branding
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [tickets]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tickets -d tickets']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [tickets]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    networks: [tickets]

volumes:
  db-data:
  redis-data:
  attachments:
  branding:

networks:
  tickets: {}
  # Shared network with Nginx Proxy Manager so NPM can reach `api:3000`
  # without publishing ports. Create it once: docker network create npm
  npm:
    external: true
